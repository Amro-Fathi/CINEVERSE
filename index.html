<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Amr Fathi Mohammed" />
    <meta name="keywords" content="HTML CSS JavaScript" />
    <title>CINEVERSE</title>

    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/font.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="icon" type="image/x-icon" href="" />
  </head>
  <body>
    <nav class="py-3">
      <div class="container-fluid">
        <div class="row">
          <div class="col-2 logo">
            <img src="./images/Logo.png" alt="Logo" class="img-fluid" />
          </div>
          <div class="col-8">
            <div class="links list-unstyled">
              <div class="link">
                <a class="nav-link active" href="#"><i class="fa-solid fa-house-user"></i> Home</a>
              </div>
              <div class="link">
                <a class="nav-link" href="./pages/"><i class="fa-solid fa-rocket"></i> Explore</a>
              </div>
              <div class="link">
                <a class="nav-link" href="./pages/"><i class="fa-solid fa-heart"></i> Favourite</a>
              </div>
              <div class="link">
                <a class="nav-link" href="./pages/"><i class="fa-solid fa-bookmark"></i> Watch List</a>
              </div>
              <div class="flex-grow-1 search-container">
                <div class="input-group">
                  <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-magnifying-glass"></i></span>
                  <input type="text" class="form-control" placeholder="Search your movie..." aria-label="Username" aria-describedby="basic-addon1" />
                </div>
              </div>
            </div>
          </div>
          <div class="col-2 account-icon" onclick="stopPropagation(event)">
            <div class="img" onclick="OpenAccountPopup()"></div>
            <i class="fa-solid fa-chevron-left account-arrow" onclick="OpenAccountPopup()"></i>
          </div>
        </div>

        <div class="account-detailes" onclick="stopPropagation(event)">
          <div class="group">
            <div class="account-details-item">My profile</div>
            <div class="account-details-item">Watch History</div>
            <div class="account-details-item">Settings</div>
            <div class="account-details-item">Language</div>
            <div class="account-details-item">Appearance</div>
          </div>
          <div class="group">
            <div class="account-details-item logout">Log Out</div>
          </div>
        </div>
      </div>
    </nav>
    <div class="navbar-button" onclick="stopPropagation(event)">
      <div class="account-icon" onclick="OpenAccountPopupRight()">
        <div class="img"></div>
      </div>
    </div>
    <div class="topbar">
      <a href="./index.html" class="topbar-logo">
        <img src="./images/Logo.png" class="img-fluid" alt="CINEVERSE" />
      </a>
      <div class="topbar-brand">
        <span>YOUR CINEMATIC UNIVERSE</span>
        <p>EXPLORE • DISCOVER • BELONG</p>
      </div>
    </div>

    <div class="account-detailes-popup" onclick="stopPropagation(event)">
      <div class="content">
        <i class="fa-solid fa-xmark close" onclick="OpenAccountPopupRight()"></i>
        <div class="logo">
          <img src="./images/Logo.png" alt="Logo" class="img-fluid" />
        </div>
        <div class="links">
          <div class="account-details-item">
            <a class="nav-link active" href="#"><i class="fa-solid fa-house-user"></i> Home</a>
          </div>

          <div class="account-details-item">
            <a class="nav-link" href="./pages/"><i class="fa-solid fa-rocket"></i> Explore</a>
          </div>
          <div class="account-details-item">
            <a class="nav-link" href="./pages/"><i class="fa-solid fa-heart"></i> Favourite</a>
          </div>
          <div class="account-details-item">
            <a class="nav-link" href="./pages/"><i class="fa-solid fa-bookmark"></i> Watch List</a>
          </div>
        </div>
        <div class="account-details-search">
          <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="search-input" placeholder="Search your movie..." aria-label="Username" aria-describedby="basic-addon1" />
        </div>
        <div class="account-icon">
          <div class="img"></div>
          <i class="fa-solid fa-chevron-left account-arrow"></i>
          <div class="settings">
            <h4>CINEVERSE</h4>
            <p class="mb-0">View Profile</p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/plugins/jquery.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/pages/home.js"></script>
  </body>
</html>
