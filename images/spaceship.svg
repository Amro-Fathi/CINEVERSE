<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 110" width="64" height="110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa3c7"/>
      <stop offset="0.5" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#6d7fa6"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e0fbff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0b3a73"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Engine flame (animated) -->
  <g>
    <path id="flame-outer" fill="url(#flame)" d="M24 26 Q32 -4 40 26 Z">
      <animateTransform attributeName="transform" type="scale" additive="sum"
        values="1 1;1 1.35;1 0.85;1 1.25;1 1" dur="0.35s" repeatCount="indefinite"
        calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
        keyTimes="0;.25;.5;.75;1"/>
    </path>
    <path fill="#fff6c8" opacity=".9" d="M28 26 Q32 8 36 26 Z">
      <animate attributeName="opacity" values=".9;.5;.9" dur=".25s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Side fins -->
  <path fill="url(#fin)" d="M22 44 L5 30 L9 64 L22 66 Z"/>
  <path fill="url(#fin)" d="M42 44 L59 30 L55 64 L42 66 Z"/>

  <!-- Engine nozzle -->
  <rect x="24" y="23" width="16" height="7" rx="2" fill="#3b4a6b"/>

  <!-- Hull (nose points DOWN) -->
  <path fill="url(#hull)" d="M32 104 C19 86 17 54 22 28 L42 28 C47 54 45 86 32 104 Z"/>
  <path fill="none" stroke="#4a5b82" stroke-width="1" d="M32 104 C19 86 17 54 22 28 L42 28 C47 54 45 86 32 104 Z"/>

  <!-- Stripe + window -->
  <rect x="22" y="40" width="20" height="4" fill="#7c5cff" opacity=".85"/>
  <circle cx="32" cy="64" r="7" fill="url(#glass)" stroke="#2a3a5e" stroke-width="1.5"/>
  <circle cx="29.5" cy="61.5" r="2" fill="#fff" opacity=".7"/>
</svg>
