<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SIGNAL LOST - Radar</title>
  <defs>
    <style>
      .draw { stroke-dasharray: 520; animation: draw 7s ease-in-out infinite; }
      .bar  { fill: #a78bfa; opacity: .15; animation: bar 3s steps(1) infinite; }
      .dot  { animation: dot 1.5s steps(1) infinite; }

      @keyframes draw {
        0%   { stroke-dashoffset: 520; fill-opacity: 0; opacity: 1; }
        35%  { stroke-dashoffset: 0;   fill-opacity: 0; }
        50%  { fill-opacity: .18; }
        85%  { stroke-dashoffset: 0;   fill-opacity: .18; opacity: 1; }
        88%  { opacity: .2; }
        90%  { opacity: 1; }
        93%  { opacity: .1; }
        100% { stroke-dashoffset: 0; fill-opacity: 0; opacity: 0; }
      }
      @keyframes bar {
        0%   { opacity: 1; }
        50%  { opacity: 1; }
        75%  { opacity: .15; }
      }
      @keyframes dot {
        0%   { opacity: 0; }
        33%  { opacity: 1; }
      }
    </style>

    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#2a1160" stop-opacity=".6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="570" y1="55" x2="400" y2="-15">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".6"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- wobbling wave + glow + colour cycling -->
    <filter id="fx" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.004 0.03" numOctaves="1" seed="2" result="n">
        <animate attributeName="baseFrequency" values="0.004 0.03;0.004 0.055;0.004 0.03" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="5" result="b"/>
      <feMerge result="m">
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="d"/>
      </feMerge>
      <feColorMatrix type="hueRotate" values="0">
        <animate attributeName="values" values="0;70;0;-70;0" dur="8s" repeatCount="indefinite"/>
      </feColorMatrix>
    </filter>

    <g id="logo" stroke-width="3" stroke-linejoin="round">
      <text x="400" y="215" text-anchor="middle" font-size="120" font-weight="900"
            font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
            textLength="560" lengthAdjust="spacingAndGlyphs">SIGNAL</text>
      <text x="400" y="335" text-anchor="middle" font-size="120" font-weight="900"
            font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
            textLength="340" lengthAdjust="spacingAndGlyphs">LOST</text>
    </g>
  </defs>

  <rect width="800" height="450" fill="#000"/>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- radar grid -->
  <g fill="none" stroke="#5b34a8" stroke-width="1" opacity=".55">
    <circle cx="400" cy="225" r="70"/>
    <circle cx="400" cy="225" r="140"/>
    <circle cx="400" cy="225" r="210"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
  </g>

  <!-- rotating sweep -->
  <path d="M400 225 L400 -15 A240 240 0 0 1 570 55 Z" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="rotate" from="0 400 225" to="360 400 225" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- pulsing rings -->
  <g fill="none" stroke="#a78bfa" stroke-width="2">
    <circle cx="400" cy="225" r="0" opacity="0">
      <animate attributeName="r" values="0;300" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="225" r="0" opacity="0">
      <animate attributeName="r" values="0;300" dur="4s" begin="1.33s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="4s" begin="1.33s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="225" r="0" opacity="0">
      <animate attributeName="r" values="0;300" dur="4s" begin="2.66s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="4s" begin="2.66s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- blips that never lock on -->
  <g fill="#7df9ff">
    <circle cx="190" cy="140" r="4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="310" r="4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="110" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="360" r="3"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting particles -->
  <g fill="#c4b5fd">
    <circle cx="80"  cy="450" r="2"><animate attributeName="cy" values="450;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="450" r="1.5"><animate attributeName="cy" values="450;-10" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="450" r="2"><animate attributeName="cy" values="450;-10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="450" r="1.5"><animate attributeName="cy" values="450;-10" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="450" r="2"><animate attributeName="cy" values="450;-10" dur="7.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="7.5s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="450" r="1.5"><animate attributeName="cy" values="450;-10" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- logo: draws on, fills, glitches out, repeats -->
  <g filter="url(#fx)">
    <use xlink:href="#logo" class="draw" fill="#c4b5fd" stroke="#e9d5ff"/>
  </g>

  <!-- signal strength icon -->
  <g>
    <rect class="bar" x="40"  y="52" width="8" height="10" style="animation-delay:0s"/>
    <rect class="bar" x="54"  y="42" width="8" height="20" style="animation-delay:.2s"/>
    <rect class="bar" x="68"  y="32" width="8" height="30" style="animation-delay:.4s"/>
    <rect class="bar" x="82"  y="22" width="8" height="40" style="animation-delay:.6s"/>
    <text x="100" y="60" font-family="'Courier New', monospace" font-size="16" fill="#ff2d75">✕</text>
  </g>

  <!-- status text -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#c4b5fd">
    <text x="40" y="415">SEARCHING<tspan class="dot">.</tspan><tspan class="dot" style="animation-delay:.5s">.</tspan><tspan class="dot" style="animation-delay:1s">.</tspan></text>
    <text x="640" y="415">SNR: -∞ dB</text>
  </g>
</svg>
