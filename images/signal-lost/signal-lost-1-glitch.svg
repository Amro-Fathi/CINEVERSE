<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SIGNAL LOST - Glitch Slice</title>
  <defs>
    <style>
      .ghostR { animation: jr 3s steps(1) infinite; }
      .ghostB { animation: jb 3s steps(1) infinite; }
      .main   { animation: flick 4s steps(1) infinite; }
      .sl1 { animation: s1 2.6s steps(1) infinite; }
      .sl2 { animation: s2 3.1s steps(1) infinite; }
      .sl3 { animation: s3 2.2s steps(1) infinite; }
      .blk { opacity: 0; animation: blk 1.7s steps(1) infinite; }
      .blink { animation: blink 1s steps(1) infinite; }
      .rise { animation: rise 6s linear infinite; }

      @keyframes jr {
        0% { transform: translate(-3px, 1px); }
        8% { transform: translate(-10px, 0); }
        10% { transform: translate(-3px, 1px); }
        52% { transform: translate(12px, -2px); }
        55% { transform: translate(-3px, 1px); }
        80% { transform: translate(-6px, 2px); }
        82% { transform: translate(-3px, 1px); }
      }
      @keyframes jb {
        0% { transform: translate(3px, -1px); }
        9% { transform: translate(11px, 1px); }
        11% { transform: translate(3px, -1px); }
        53% { transform: translate(-13px, 2px); }
        56% { transform: translate(3px, -1px); }
        81% { transform: translate(7px, -2px); }
        83% { transform: translate(3px, -1px); }
      }
      @keyframes flick {
        0% { opacity: 1; }
        30% { opacity: .4; }
        31% { opacity: 1; }
        33% { opacity: .6; }
        34% { opacity: 1; }
        80% { opacity: .2; }
        81% { opacity: 1; }
      }
      @keyframes s1 {
        0% { transform: translate(0, 0); }
        10% { transform: translate(-26px, 0); }
        13% { transform: translate(0, 0); }
        40% { transform: translate(30px, 0); }
        43% { transform: translate(0, 0); }
        70% { transform: translate(-14px, 0); }
        72% { transform: translate(0, 0); }
      }
      @keyframes s2 {
        0% { transform: translate(0, 0); }
        20% { transform: translate(34px, 0); }
        23% { transform: translate(0, 0); }
        55% { transform: translate(-28px, 0); }
        58% { transform: translate(0, 0); }
        90% { transform: translate(18px, 0); }
        92% { transform: translate(0, 0); }
      }
      @keyframes s3 {
        0% { transform: translate(0, 0); }
        15% { transform: translate(-20px, 0); }
        18% { transform: translate(0, 0); }
        60% { transform: translate(26px, 0); }
        63% { transform: translate(0, 0); }
      }
      @keyframes blk {
        0% { opacity: 0; }
        20% { opacity: .9; }
        24% { opacity: 0; }
        60% { opacity: .7; }
        63% { opacity: 0; }
      }
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes rise {
        from { transform: translateY(0); }
        to { transform: translateY(-450px); }
      }
    </style>

    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#3a0f6b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" opacity=".5"/>
    </pattern>

    <g id="logo" stroke-width="3" stroke-linejoin="round">
      <text x="400" y="215" text-anchor="middle" font-size="120" font-weight="900"
            font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
            textLength="560" lengthAdjust="spacingAndGlyphs">SIGNAL</text>
      <text x="400" y="335" text-anchor="middle" font-size="120" font-weight="900"
            font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
            textLength="340" lengthAdjust="spacingAndGlyphs">LOST</text>
    </g>

    <clipPath id="c1"><rect x="0" y="140" width="800" height="22"/></clipPath>
    <clipPath id="c2"><rect x="0" y="195" width="800" height="26"/></clipPath>
    <clipPath id="c3"><rect x="0" y="290" width="800" height="24"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="#000"/>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- rising data specks -->
  <g fill="#a78bfa" opacity=".5">
    <g class="rise"><rect x="90" y="470" width="2" height="8"/><rect x="700" y="520" width="2" height="12"/><rect x="230" y="600" width="2" height="6"/></g>
    <g class="rise" style="animation-duration:9s"><rect x="150" y="500" width="2" height="10"/><rect x="620" y="470" width="2" height="7"/><rect x="760" y="640" width="2" height="9"/></g>
  </g>

  <!-- logo -->
  <g filter="url(#glow)">
    <use xlink:href="#logo" class="ghostR" fill="none" stroke="#ff2d75" opacity=".85"/>
    <use xlink:href="#logo" class="ghostB" fill="none" stroke="#2f6bff" opacity=".85"/>
    <use xlink:href="#logo" class="main" fill="none" stroke="#f1e4ff"/>
  </g>

  <!-- sliced, shifted copies of the logo -->
  <g clip-path="url(#c1)"><use xlink:href="#logo" class="sl1" fill="none" stroke="#ffffff"/></g>
  <g clip-path="url(#c2)"><use xlink:href="#logo" class="sl2" fill="none" stroke="#7df9ff"/></g>
  <g clip-path="url(#c3)"><use xlink:href="#logo" class="sl3" fill="none" stroke="#ff7ad9"/></g>

  <!-- glitch blocks -->
  <rect class="blk" x="120" y="150" width="90" height="10" fill="#ff2d75"/>
  <rect class="blk" x="560" y="205" width="130" height="8" fill="#2f6bff" style="animation-delay:.5s"/>
  <rect class="blk" x="300" y="300" width="70" height="12" fill="#7df9ff" style="animation-delay:1s"/>
  <rect class="blk" x="610" y="320" width="60" height="6" fill="#ffffff" style="animation-delay:1.3s"/>

  <!-- HUD -->
  <g fill="none" stroke="#a78bfa" stroke-width="2" opacity=".7">
    <path d="M30 70 V30 H70"/>
    <path d="M770 70 V30 H730"/>
    <path d="M30 380 V420 H70"/>
    <path d="M770 380 V420 H730"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="13" fill="#c4b5fd">
    <text x="50" y="52"><tspan class="blink" fill="#ff2d75">●</tspan> ERR_0x53 // CONNECTION DROPPED</text>
    <text x="550" y="406">RECONNECTING</text>
  </g>
  <rect x="660" y="396" width="90" height="10" fill="none" stroke="#a78bfa"/>
  <rect x="662" y="398" width="0" height="6" fill="#a78bfa">
    <animate attributeName="width" values="0;20;20;50;50;70;0" dur="3s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <!-- scanlines + moving band -->
  <rect width="800" height="450" fill="url(#scan)"/>
  <rect x="0" y="-60" width="800" height="60" fill="#fff" opacity=".05">
    <animate attributeName="y" values="-60;450" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
