<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 124" width="752" height="248" class="claw-svg open" role="img" aria-label="Robotic claw attached to an energy tube" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    /* STATES: add class "open" or "closed" on the root svg element.
       open   = pincers apart, cyan energy
       closed = pincers shut, amber energy */
    .claw-svg { --accent: #22d3ee; overflow: visible; }
    .claw-svg.open   { --accent: #22d3ee; }
    .claw-svg.closed { --accent: #f5a524; }

    .claw-svg .accent-fill   { fill: var(--accent);   transition: fill .45s ease; }
    .claw-svg .accent-stroke { stroke: var(--accent); transition: stroke .45s ease; }

    /* pincers rotate around their pivots (local 0 0) */
    .claw-svg .pin {
      transform-box: view-box;
      transform-origin: 0 0;
      transition: transform .55s cubic-bezier(.6, -.25, .3, 1.25);
    }
    .claw-svg.open   .pin-t, .claw-svg.open   .pin-b { transform: rotate(0deg); }
    .claw-svg.closed .pin-t { transform: rotate(-32deg); }
    .claw-svg.closed .pin-b { transform: rotate(32deg); }

    /* energy flowing through the tube toward the claw */
    .claw-svg .energy { stroke-dasharray: 6 14; animation: clawFlow 1s linear infinite; }
    .claw-svg.closed .energy { animation-duration: .45s; }
    @keyframes clawFlow { to { stroke-dashoffset: 20; } }

    .claw-svg .part { animation: clawDrift 3s linear infinite; }
    .claw-svg.closed .part { animation-duration: 1.4s; }
    @keyframes clawDrift {
      0%   { transform: translateX(0);      opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(-155px); opacity: 0; }
    }

    .claw-svg .led-glow { animation: clawPulse 1.8s ease-in-out infinite; }
    .claw-svg.closed .led-glow { animation-duration: .7s; }
    @keyframes clawPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

    .claw-svg .tube-glow { opacity: .35; transition: opacity .45s ease; }
    .claw-svg.closed .tube-glow { opacity: .6; }

    @media (prefers-reduced-motion: reduce) {
      .claw-svg .energy, .claw-svg .part, .claw-svg .led-glow { animation: none; }
      .claw-svg .pin { transition: none; }
    }
  </style>

  <defs>
    <linearGradient id="clawBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a73d4" />
      <stop offset="0.45" stop-color="#4d56b3" />
      <stop offset="1" stop-color="#303687" />
    </linearGradient>
    <linearGradient id="clawRib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c96ea" />
      <stop offset="0.35" stop-color="#4d56b3" />
      <stop offset="0.75" stop-color="#2b307a" />
      <stop offset="1" stop-color="#4d56b3" />
    </linearGradient>
    <linearGradient id="clawGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b64cc" />
      <stop offset="0.2" stop-color="#2b307a" />
      <stop offset="0.5" stop-color="#0b0d2b" />
      <stop offset="0.85" stop-color="#1b1e4b" />
      <stop offset="1" stop-color="#3a3f9a" />
    </linearGradient>
    <filter id="clawBlur" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="clawBlurS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>

  <!-- ═══════════ TUBE ═══════════ -->
  <g id="tube">
    <!-- glass shell -->
    <rect x="158" y="44" width="196" height="36" rx="18" fill="url(#clawGlass)" stroke="#1b1e4b" stroke-width="3" />
    <!-- energy glow + core -->
    <line class="tube-glow accent-stroke" x1="176" y1="62" x2="338" y2="62" stroke-width="12" stroke-linecap="round" filter="url(#clawBlur)" />
    <line x1="176" y1="62" x2="338" y2="62" stroke="#0b0d2b" stroke-width="7" stroke-linecap="round" />
    <line class="energy accent-stroke" x1="176" y1="62" x2="338" y2="62" stroke-width="3.4" stroke-linecap="round" />
    <!-- particles -->
    <g class="accent-fill">
      <circle class="part" cx="336" cy="57.5" r="1.6" style="animation-delay:-0.2s" />
      <circle class="part" cx="336" cy="66.5" r="1.4" style="animation-delay:-0.9s" />
      <circle class="part" cx="336" cy="60"   r="1.2" style="animation-delay:-1.5s" />
      <circle class="part" cx="336" cy="65"   r="1.6" style="animation-delay:-2.1s" />
      <circle class="part" cx="336" cy="62"   r="1.3" style="animation-delay:-2.6s" />
    </g>
    <!-- glass reflections -->
    <rect x="176" y="48" width="160" height="3.4" rx="1.7" fill="#fff" opacity="0.22" />
    <rect x="190" y="74" width="130" height="2" rx="1" fill="#9aa4f0" opacity="0.28" />

    <!-- ribs -->
    <g stroke="#1b1e4b" stroke-width="2.5" fill="url(#clawRib)">
      <rect x="206" y="38" width="12" height="48" rx="5" />
      <rect x="258" y="38" width="12" height="48" rx="5" />
      <rect x="310" y="38" width="12" height="48" rx="5" />
    </g>
    <g fill="#1b1e4b">
      <circle cx="212" cy="43" r="1.6" /><circle cx="212" cy="81" r="1.6" />
      <circle cx="264" cy="43" r="1.6" /><circle cx="264" cy="81" r="1.6" />
      <circle cx="316" cy="43" r="1.6" /><circle cx="316" cy="81" r="1.6" />
    </g>

    <!-- mounting flange -->
    <rect x="348" y="32" width="18" height="60" rx="7" fill="url(#clawBody)" stroke="#1b1e4b" stroke-width="3" />
    <circle cx="357" cy="42" r="2.6" fill="#1b1e4b" /><circle cx="357" cy="82" r="2.6" fill="#1b1e4b" />
    <circle cx="357" cy="62" r="4.2" fill="#0b0d2b" stroke="#1b1e4b" stroke-width="1.5" />
    <circle cx="357" cy="62" r="2" class="accent-fill led-glow" />

    <!-- claw-side coupling -->
    <rect x="146" y="50" width="22" height="24" rx="4" fill="#2b307a" stroke="#1b1e4b" stroke-width="3" />
    <rect x="156" y="40" width="9" height="44" rx="3.5" fill="url(#clawRib)" stroke="#1b1e4b" stroke-width="2.5" />
  </g>

  <!-- ═══════════ CLAW ═══════════ -->
  <g id="claw" transform="translate(10 12)">
    <!-- top pincer -->
    <g transform="translate(100.7 31.5)">
      <g class="pin pin-t">
        <path d="M0 0 A54 54 0 0 0 -77.7 -28.3" fill="none" stroke="#1b1e4b" stroke-width="15" stroke-linecap="round" />
        <path d="M0 0 A54 54 0 0 0 -77.7 -28.3" fill="none" stroke="#9aa4f0" stroke-width="9" stroke-linecap="round" />
        <path d="M0 0 A54 54 0 0 0 -77.7 -28.3" fill="none" stroke="#dfe4ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="46 14 18 100" opacity="0.65" />
        <circle cx="-77.7" cy="-28.3" r="5.2" class="accent-fill" stroke="#1b1e4b" stroke-width="2" />
      </g>
    </g>
    <!-- bottom pincer -->
    <g transform="translate(100.7 68.5)">
      <g class="pin pin-b">
        <path d="M0 0 A54 54 0 0 1 -77.7 28.3" fill="none" stroke="#1b1e4b" stroke-width="15" stroke-linecap="round" />
        <path d="M0 0 A54 54 0 0 1 -77.7 28.3" fill="none" stroke="#9aa4f0" stroke-width="9" stroke-linecap="round" />
        <path d="M0 0 A54 54 0 0 1 -77.7 28.3" fill="none" stroke="#dfe4ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="46 14 18 100" opacity="0.65" />
        <circle cx="-77.7" cy="28.3" r="5.2" class="accent-fill" stroke="#1b1e4b" stroke-width="2" />
      </g>
    </g>

    <!-- body -->
    <rect x="92" y="22" width="48" height="56" rx="10" fill="url(#clawBody)" stroke="#1b1e4b" stroke-width="3" />
    <rect x="95" y="25" width="42" height="5" rx="2.5" fill="#fff" opacity="0.14" />
    <rect x="100" y="30" width="32" height="8" rx="4" fill="#2b307a" />
    <!-- LED -->
    <circle cx="116" cy="54" r="8.5" fill="#0b0d2b" stroke="#1b1e4b" stroke-width="2" />
    <circle class="led-glow accent-fill" cx="116" cy="54" r="7" filter="url(#clawBlurS)" />
    <circle class="accent-fill" cx="116" cy="54" r="5" />
    <circle cx="114.4" cy="52.4" r="1.6" fill="#fff" opacity="0.8" />
    <!-- vents -->
    <rect x="100" y="64" width="32" height="6" rx="3" fill="#2b307a" />
    <g stroke="#1b1e4b" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <line x1="108" y1="65.5" x2="108" y2="68.5" /><line x1="114" y1="65.5" x2="114" y2="68.5" />
      <line x1="120" y1="65.5" x2="120" y2="68.5" /><line x1="126" y1="65.5" x2="126" y2="68.5" />
    </g>
    <!-- rivets -->
    <circle cx="99" cy="73" r="1.7" fill="#1b1e4b" /><circle cx="133" cy="73" r="1.7" fill="#1b1e4b" />
  </g>
</svg>
